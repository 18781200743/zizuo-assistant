name: build-mac

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "main.py"
      - "requirements_mac.txt"
      - "build_mac.sh"
      - ".github/workflows/build-mac.yml"

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-13 已于 2025-12 下线，Intel 构建机改用 macos-15-intel（可用到 2027-08）
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_mac.txt

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv-mac
          key: mac-venv-py311-${{ hashFiles('requirements_mac.txt') }}
          restore-keys: |
            mac-venv-py311-

      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: ~/.cache/zizuo/chrome-mac-x64.zip
          key: chrome-mac-x64-v1

      - name: Build .app
        run: bash build_mac.sh

      - name: Publish release (方便用加速镜像下载)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "dist/Zizuo助手-mac.zip" "dist/Zizuo-mac.zip"
          gh release view mac-latest >/dev/null 2>&1 || \
            gh release create mac-latest --title "Mac 最新版" --notes "自动构建（含内置 Chrome，未签名）"
          gh release upload mac-latest dist/Zizuo-mac.zip --clobber
