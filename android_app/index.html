<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>紫作助手</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f5f7; color: #1c2430;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { padding-top: env(safe-area-inset-top); }
    .page { display: none; min-height: 100%; padding: 18px 16px 28px; }
    .page.active { display: block; }

    /* 首页 */
    .home-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 22px; }
    .home-title { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    .home-sub { font-size: 13px; color: #7a8699; margin-top: -14px; margin-bottom: 22px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .account { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .account .name { font-weight: 600; font-size: 16px; }
    .account .tag { font-size: 12px; color: #14a06a; background: #e8f7ef; padding: 3px 8px; border-radius: 20px; }
    .btns { display: flex; gap: 10px; margin-top: 14px; }
    .btn { flex: 1; border: 0; border-radius: 12px; padding: 14px 10px; font-size: 16px;
      background: #eef1f6; color: #1c2430; font-weight: 600; }
    .btn.primary { background: #14a06a; color: #fff; }
    .btn.dark { background: #1f2836; color: #fff; }
    .hint { margin-top: 16px; font-size: 13px; color: #8b97a8; line-height: 1.7; }

    /* 功能页 */
    .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .nav .back { border: 0; background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 15px; }
    .nav .title { font-size: 18px; font-weight: 700; }
    .status { font-size: 12px; color: #7a8699; margin: 4px 2px 14px; line-height: 1.6; }
    .status.ok { color: #15803d; }
    .status.bad { color: #c2410c; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid .btn { padding: 18px 10px; font-size: 16px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .grid .btn.on { background: #14a06a; color: #fff; }
    .grid .btn.warn { background: #fff7ed; color: #b45309; }
    .grid .btn.full { grid-column: span 2; }
    .info { margin-top: 14px; padding: 12px; background: #fff; border-radius: 12px;
      font-size: 13px; color: #5b6779; line-height: 1.7; min-height: 44px; }

    /* 怪物列表 */
    #list { display: none; }
    #list .item { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
    #list .item.boss { border-left: 4px solid #f59e0b; }
    #list .name { font-size: 14px; font-weight: 600; max-width: 55%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    #list .meta { font-size: 12px; color: #8b97a8; }
    #list .go { border: 0; border-radius: 10px; padding: 8px 14px; background: #14a06a; color: #fff; }

    .tip { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; font-size: 12px; color: #9aa5b5; }
  </style>
</head>
<body>
  <!-- 首页 -->
  <div class="page active" id="pageHome">
    <div class="home-head">
      <div class="home-title">紫作助手</div>
    </div>
    <div class="home-sub">百炼英雄 · 安卓版</div>

    <div class="card">
      <div class="account">
        <div>
          <div class="name">本机游戏</div>
          <div class="tag" id="homeState">未打开</div>
        </div>
      </div>
      <div class="btns">
        <button class="btn primary" id="btnOpen">▶ 打开游戏</button>
        <button class="btn dark" id="btnFunc">功能</button>
      </div>
    </div>

    <div class="hint">
      打开游戏 → 用验证码登录 → 进入主界面后自动连接。<br>
      功能里是红包、复活、刷新、闪现等；按手机返回键回到这里。
    </div>
  </div>

  <!-- 功能页 -->
  <div class="page" id="pageFunc">
    <div class="nav">
      <button class="back" id="btnBackHome">‹ 返回</button>
      <div class="title">功能</div>
      <span style="width:56px"></span>
    </div>
    <div class="status" id="status">未连接</div>
    <div class="grid">
      <button class="btn" id="fRed">红包</button>
      <button class="btn" id="fRevive">复活</button>
      <button class="btn" id="fMob">小怪刷新</button>
      <button class="btn" id="fBoss">BOSS刷新</button>
      <button class="btn" id="fMonsters">怪物 / 闪现</button>
      <button class="btn" id="fClear">清除卡图</button>
    </div>
    <div class="info" id="info">—</div>
  </div>

  <!-- 怪物列表 -->
  <div class="page" id="list">
    <div class="nav">
      <button class="back" id="btnListBack">‹ 返回</button>
      <div class="title">附近怪物</div>
      <button class="back" id="btnListRefresh">刷新</button>
    </div>
    <div id="listItems"></div>
  </div>

  <script src="js/mapping.js"></script>
  <script src="js/renames.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
