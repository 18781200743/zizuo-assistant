<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>紫作助手</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; background: #10131a; color: #e8edf5;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
    #toolbar { position: fixed; left: 0; right: 0; top: 0; z-index: 30; background: #161b25;
      border-bottom: 1px solid #243046; padding: 6px 8px 8px; }
    .row { display: flex; align-items: center; gap: 6px; overflow-x: auto; white-space: nowrap; }
    .row + .row { margin-top: 6px; }
    .title { font-size: 15px; font-weight: 700; margin-right: 6px; }
    .status { font-size: 11px; color: #7f8ea8; }
    .status.ok { color: #4ade80; }
    .status.bad { color: #f87171; }
    button { border: 0; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #eaf2ff;
      background: #24314a; flex: 0 0 auto; }
    button.primary { background: #2563eb; }
    button.on { background: #16a34a; }
    button.off { background: #3a465c; }
    button.warn { background: #b45309; }
    #info { font-size: 12px; color: #9fb0c7; overflow: hidden; text-overflow: ellipsis; }
    #gameTip { position: fixed; inset: 0; top: 108px; display: flex; align-items: center;
      justify-content: center; color: #6b7c96; font-size: 14px; text-align: center; padding: 20px; }
    #list { position: fixed; inset: 0; z-index: 40; background: #0d1118; display: none;
      flex-direction: column; }
    #list header { padding: 10px 12px; background: #161b25; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid #243046; }
    #list .items { flex: 1; overflow-y: auto; padding: 6px 8px 20px; }
    .item { padding: 10px; border-radius: 8px; background: #161c27; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .item .name { max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { color: #8ea3bf; font-size: 11px; }
    .item.boss { border-left: 3px solid #f59e0b; }
    .item button { padding: 6px 12px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="row">
      <span class="title">紫作助手</span>
      <span id="status" class="status">正在连接游戏…</span>
    </div>
    <div class="row">
      <button id="btnRed" class="off">红包</button>
      <button id="btnRevive" class="off">复活</button>
      <button id="btnMob" class="off">小怪刷新</button>
      <button id="btnBoss" class="off">BOSS刷新</button>
      <button id="btnBlink">怪物/闪现</button>
      <button id="btnClear" class="warn">清除卡图</button>
    </div>
    <div class="row"><span id="info">—</span></div>
  </div>

  <div id="gameTip">游戏窗口加载中…</div>

  <div id="list">
    <header>
      <span>附近怪物</span>
      <span>
        <button id="btnListRefresh">刷新</button>
        <button id="btnListClose">关闭</button>
      </span>
    </header>
    <div class="items" id="listItems"></div>
  </div>

  <script src="js/mapping.js"></script>
  <script src="js/renames.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
